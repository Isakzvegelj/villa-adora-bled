<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c524f"/>
      <stop offset="0.55" stop-color="#123a3a"/>
      <stop offset="1" stop-color="#0a2424"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0da96"/>
      <stop offset="0.45" stop-color="#dcc070"/>
      <stop offset="1" stop-color="#c3a048"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63bcb1"/>
      <stop offset="1" stop-color="#3a948c"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- subtle frame -->
  <rect x="4" y="4" width="56" height="56" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>

  <!-- serif 'A' monogram (Adora) -->
  <text x="32" y="27.5" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', 'Didot', serif" font-size="37" font-weight="500"
        fill="url(#gold)">A</text>

  <!-- elegant gold thread + diamond (the crossbar accent) -->
  <line x1="17" y1="37.5" x2="47" y2="37.5" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round" opacity="0.95"/>
  <path d="M32 34.5 l2 3 -2 3 -2 -3 z" fill="url(#gold)"/>

  <!-- lake waves -->
  <path d="M 12 49 q 5 -3.2 10 0 t 10 0 t 10 0 t 10 0" fill="none" stroke="url(#lake)" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M 16 54.5 q 4 -2.6 8 0 t 8 0 t 8 0 t 8 0" fill="none" stroke="url(#lake)" stroke-width="1.4" stroke-linecap="round" opacity="0.72"/>
  <!-- Bled island dot -->
  <circle cx="46" cy="48.6" r="1.6" fill="#e9f7f2"/>
</svg>
